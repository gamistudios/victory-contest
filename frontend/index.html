<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contest App - Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Public Sans", sans-serif;
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        width: 100vw;
      }

      /* Telegram theme CSS variables */
      :root {
        --tg-theme-bg-color: #ffffff;
        --tg-theme-text-color: #000000;
        --tg-theme-hint-color: #999999;
        --tg-theme-link-color: #2481cc;
        --tg-theme-button-color: #2481cc;
        --tg-theme-button-text-color: #ffffff;
        --tg-theme-secondary-bg-color: #f5f5f5;
      }

      /* Dark theme overrides */
      [data-theme="dark"] {
        --tg-theme-bg-color: #1a1a1a;
        --tg-theme-text-color: #ffffff;
        --tg-theme-hint-color: #8e8e93;
        --tg-theme-link-color: #6ab7ff;
        --tg-theme-button-color: #5288c1;
        --tg-theme-button-text-color: #ffffff;
        --tg-theme-secondary-bg-color: #2c2c2e;
      }

      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Touch optimization */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      input,
      textarea,
      button {
        -webkit-user-select: auto;
        -moz-user-select: auto;
        -ms-user-select: auto;
        user-select: auto;
      }

      /* Loading spinner */
      .loading-spinner {
        border: 2px solid #f3f3f3;
        border-top: 2px solid var(--tg-theme-button-color, #2481cc);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--tg-theme-hint-color, #999999);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--tg-theme-text-color, #000000);
      }

      /* Safe area for mobile devices */
      @supports (padding: max(0px)) {
        body {
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
      @keyframes slideDown {
        from {
          height: 0;
          opacity: 0;
        }
        to {
          height: var(--radix-collapsible-content-height);
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          height: var(--radix-collapsible-content-height);
          opacity: 1;
        }
        to {
          height: 0;
          opacity: 0;
        }
      }
      .animate-slideDown {
        animation: slideDown 300ms ease-out;
      }
      .animate-slideUp {
        animation: slideUp 300ms ease-in;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
