<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#00AB55" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VC Admin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&display=swap"
      rel="stylesheet"
    />
    <title>Victory Contest Admin</title>
    <style>
      * {
        margin: 0;
      }
    </style>
    <script>
      // Last-resort error surface: any startup crash used to leave a silent
      // white page (empty #root on a white body) with nothing to diagnose by.
      (function () {
        function show(message) {
          var box = document.getElementById("boot-error");
          if (!box) {
            box = document.createElement("pre");
            box.id = "boot-error";
            box.style.cssText =
              "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;" +
              "max-height:45vh;overflow:auto;margin:0;padding:10px;" +
              "background:#b00020;color:#fff;font:12px/1.4 monospace;" +
              "white-space:pre-wrap;word-break:break-word";
            (document.body || document.documentElement).appendChild(box);
          }
          box.textContent += message + "\n\n";
        }
        window.addEventListener("error", function (e) {
          if (e.message) show("Error: " + e.message + "\n  at " + e.filename + ":" + e.lineno + ":" + e.colno);
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("Unhandled rejection: " + (r && r.stack ? r.stack : String(r)));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
